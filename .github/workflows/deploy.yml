name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build (indexes + static site)
        run: npm run build
        env:
          # Astro/site config reads these to compute the correct base path
          # and canonical URL for a Project Pages deployment automatically —
          # see config/site.ts. Set SITE_CNAME as a repo variable instead if
          # you're using a custom domain.
          GITHUB_REPOSITORY: ${{ github.repository }}
          SITE_CNAME: ${{ vars.SITE_CNAME }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
